services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: teacher_platform_db
      MYSQL_USER: teacher
      MYSQL_PASSWORD: local-teacher-only
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - teacher_db:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "teacher", "-plocal-teacher-only"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  teacher_db:
